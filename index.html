<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuzu's Maze</title>
  <meta name="description" content="A free-to-play memory puzzle game. Step across face-down wooden tiles, collect five flowers in order, and remember where the vine monsters hide.">
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="./"><img src="assets/favicon.png" alt="">Kuzu's Maze</a>
      <nav>
        <a href="privacy.html">Privacy</a>
        <a href="credits.html">Credits</a>
      </nav>
    </div>
  </header>

  <main class="wrap hero">
    <button class="tile" type="button" aria-label="Kuzu's Maze tile. Tap to flip it.">
      <span class="tile-inner">
        <img class="tile-back" src="assets/logo_tile.webp" alt="" width="168" height="168" draggable="false">
        <img class="tile-face" alt="" width="168" height="168" draggable="false">
      </span>
    </button>
    <h1>Kuzu's Maze</h1>
    <p class="tagline">A free-to-play memory puzzle game. Step across face-down wooden tiles, collect five flowers in order, and remember where the vine monsters hide.</p>

    <!-- Store links: when a listing goes live, swap its <span class="store soon"> for
         <a class="store" href="STORE_URL"><small>Get it on</small><span>Google Play</span></a> -->
    <div class="stores">
      <span class="store soon"><small>Coming soon to</small><span>Google Play</span></span>
      <span class="store soon"><small>Coming soon to the</small><span>App Store</span></span>
    </div>
  </main>
  <script src="flip.js" defer></script>
</body>
</html>
